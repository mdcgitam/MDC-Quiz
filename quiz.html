<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MDC Quiz · Meta Developer Communities, GITAM</title>
<meta name="description" content="Live quiz platform of Meta Developer Communities (MDC), GITAM's student-run developer community.">
<meta name="theme-color" content="#3B0F2C">
<link rel="icon" type="image/png" href="mdclogobw.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Josefin+Sans:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* colours follow the Meta Code Quest 2.0 · Hack-O-Ween poster: plum-maroon night, bone text, pumpkin orange */
:root{color-scheme:dark;--bg:#3B0F2C;--card:#4A1739;--ink:#EFE8D8;--mut:#D2BFCB;--acc:#F2801F;--acc2:#D9650A;--soft:#F2801F26;--good:#5CF2C0;--bad:#FF6B81;--line:#ffffff24;--tile:#25081C;--on-acc:#2A0A20;--cat:#F5C518;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#5A1A45 0%,#3B0F2C 55%,#25081C 100%) fixed,var(--bg);color:var(--ink);font:16px/1.5 Inter,"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
#app{width:100%;display:flex;justify-content:center}
.card{background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:22px;padding:26px;width:100%;max-width:480px;margin-top:4vh;box-shadow:0 18px 50px #0000004d;box-sizing:border-box}
.wide{max-width:960px}
h2,h3{font-family:"Josefin Sans",Inter,sans-serif}
h1,.code{font-family:Creepster,"Josefin Sans",cursive;font-weight:400;letter-spacing:.05em}
h1{margin:0 0 6px;font-size:34px}h2{white-space:pre-wrap;font-size:20px;margin:18px 0}h3{margin:20px 0 6px}
.sub{color:var(--mut);margin:0 0 16px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand img{width:52px;height:52px;flex:none;background:var(--tile);border-radius:14px;padding:4px;box-sizing:border-box;object-fit:contain}
.brand b{display:block;font:700 18px/1.2 "Josefin Sans",Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.brand small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.foot{color:var(--mut);font-size:12px;text-align:center;margin:18px 0 4px}
.foot a{color:var(--acc);font-weight:700;text-decoration:none}
:focus-visible{outline:2px solid var(--cat);outline-offset:2px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0}
label .rq{color:var(--bad);margin-left:2px}
input,textarea,select{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
input.inv,select.inv{border-color:var(--bad);background:#ff6b8118}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:40px}
select:invalid{color:var(--mut)}
#rc{text-transform:uppercase;letter-spacing:.2em;font-weight:800}
#rn{text-transform:uppercase}
#rn::placeholder,#rc::placeholder{text-transform:none;letter-spacing:normal}
.btn{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:var(--on-acc);font:800 16px Inter,sans-serif;cursor:pointer}
.btn:active{transform:scale(.98)}.btn.alt{background:var(--ink);color:var(--card)}.btn.ok{background:linear-gradient(90deg,#5CF2C0,#2fcf9c)}
.btn:disabled{opacity:.6;cursor:wait}
.lnk{display:inline-block;margin-top:14px;color:var(--acc);font-weight:700;cursor:pointer}
.msg{color:var(--bad);min-height:1.4em;margin:8px 0 0;font-size:14px}
.top{display:flex;align-items:center;gap:10px;color:var(--mut);font-weight:700;font-size:14px}
.top b{margin-left:auto;font-size:20px;color:var(--acc)}
.pts{background:var(--bg);border-radius:99px;padding:2px 10px}
.bar{height:8px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--acc);border-radius:9px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:700 16px Inter,sans-serif;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--soft)}
.opt em{font-style:normal;width:28px;height:28px;flex:none;border-radius:9px;background:var(--line);display:grid;place-items:center;font-size:13px}
.good{border-color:var(--good);background:#5CF2C022}.bad{border-color:var(--bad);background:#ff6b8126}
.live{color:var(--mut);text-align:center;margin:16px 0 0;font-size:14px}
.center{text-align:center}.center .brand{justify-content:center}.big{font-size:56px;margin:8px 0}
.lb{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.lb li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.lb li.me{outline:2px solid var(--cat)}
.lb .rk{width:28px;text-align:center;font-weight:800}.lb .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb small{color:var(--mut)}.lb b{min-width:48px;text-align:right}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.hd .acts{display:flex;gap:8px;flex-wrap:wrap}
.code{font-size:48px;letter-spacing:.15em;color:var(--acc)}
.hd .btn{margin:0;width:auto;padding:12px 20px}
.tabs{display:flex;gap:8px;margin:6px 0 14px}
.tab{flex:1;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:800 14px Inter,sans-serif;cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--acc),var(--acc2));border-color:var(--acc);color:var(--on-acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--bg);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}
.stats b{display:block;font-size:22px;color:var(--ink)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:940px}
th{text-align:left;color:var(--mut);font-size:12px;padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mut)}
.dot.on{background:var(--good)}.dot.dn{background:var(--acc)}

/* ---- compact join form (desktop, no scroll) ---- */
.form-grid{display:grid;gap:10px 14px}
.form-grid label{margin:0}
.form-grid .full{grid-column:1/-1}
.note{font-size:12px;color:var(--mut);margin:0}
@media(min-width:640px){
  body{padding:20px}
  .form-grid{grid-template-columns:1fr 1fr}
  .card.compact{margin-top:2vh;padding:22px 26px;max-width:560px}
  .card.compact h1{font-size:26px;margin-bottom:2px}
  .card.compact .sub{margin:0 0 12px;font-size:14px}
  .card.compact label{font-size:13px}
  .card.compact input,.card.compact select{padding:9px 12px;margin-top:4px}
  .card.compact .btn{margin-top:8px;padding:12px}
  .card.compact .lnk{margin-top:10px}
  .card.compact .msg{min-height:1.2em;font-size:13px}
}

/* ---- top participants modal ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999;backdrop-filter:blur(3px)}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px;max-width:520px;width:100%;box-shadow:0 25px 60px #0007;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h2{margin:0 0 14px}
.modal-card .btn{margin-top:16px}

/* ---- histogram ---- */
.hist{display:flex;flex-direction:column;margin:6px 0 4px}
.hist-bars{display:flex;align-items:flex-end;gap:10px;padding:26px 4px 0;border-bottom:2px solid var(--line)}
.hist-col{flex:1;min-width:0;height:180px;display:flex;align-items:flex-end;justify-content:center}
.hist-bar{width:100%;max-width:64px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--acc),var(--acc2));position:relative;min-height:6px;transition:height .45s cubic-bezier(.4,0,.2,1)}
.hist-bar.me{background:linear-gradient(180deg,var(--cat),#d9a400);box-shadow:0 0 0 2px #F5C51855}
.hist-val{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap}
.hist-names{display:flex;gap:10px;padding:8px 4px 0}
.hist-names .nm-col{flex:1;min-width:0;font-size:11px;font-weight:700;color:var(--mut);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-names .nm-col.me{color:var(--acc)}
a.btn{display:inline-block;text-align:center;text-decoration:none;box-sizing:border-box}

/* ---- projector leaderboard (quiz.html?board=CODE) ---- */
.card.proj{max-width:1100px;margin-top:2vh}
.proj .lb{gap:.45em;font-size:clamp(16px,2.6vh,30px)}
.proj .lb li{padding:.45em .8em;border-radius:.6em;will-change:transform}
.proj .lb .rk{width:2.2em}
.proj .lb b{min-width:4em;font-size:1.15em}
.proj .lb li.top{background:var(--soft)}
.proj .lb li.bump b{color:var(--good)}
.proj .meta{color:var(--mut);font-weight:700;font-size:clamp(14px,2.2vh,22px);text-align:right}
@media(prefers-reduced-motion:reduce){.proj .lb li{transition:none!important}}
</style></head><body><div id="app"></div>
<p class="foot">Meta Code Quest 2.0 · Hack-O-Ween · Meta Developer Communities · GITAM · <a href="https://mdcgitam.in" target="_blank" rel="noopener">mdcgitam.in</a></p>
<script>
/* All scoring, timing and the answer key live in Supabase (see supabase-setup.sql).
   The browser only talks to the quiz_* database functions; it cannot read or write the tables directly. */

/* ---- signup options (keep in sync with quiz_join in supabase-setup.sql) ---- */
const YEARS=['1st Year','2nd Year','3rd Year','4th Year'];
const DEPTS=['CSE-AIML','Core','CS','DS'];

const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
const tm=t=>t?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const BRAND=`<header class="brand"><img src="mdclogobw.png" alt="MDC logo"><div><b>MDC Quiz</b><small>Meta Developer Communities · GITAM</small></div></header>`;
const SUPA_URL='https://dxbypnjnzfcfwjtbwgai.supabase.co', SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4YnlwbmpuemZjZndqdGJ3Z2FpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODk5ODgsImV4cCI6MjEwNjk2NTk4OH0.cjHgzkdQB0pSlBDp7ZHftT1RuCsmyRndpQP2-glKiBw';

/* ---------- database calls ---------- */
// Retries network errors, 408/429 and 5xx with jittered backoff so a burst of 100 players doesn't drop requests.
async function rpc(fn,args={},tries=3){
  for(let a=0;;a++){
    try{
      const r=await fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
      const t=await r.text(), j=t?JSON.parse(t):null;
      if(r.ok) return j;
      const e=Error((j&&j.message)||'Server error '+r.status); e.fatal=r.status<500&&r.status!==408&&r.status!==429; throw e;
    }catch(e){if(e.fatal||a>=tries)throw e}
    await sleep(300*2**a+Math.random()*500);
  }
}
const friendly=e=>/fetch|network|load failed|server error|JSON|Unexpected token/i.test(e.message)?'Could not reach the server. Check your internet and try again.':e.message;
// Runs fn now and then every ms, starting at a random offset so clients don't hit the database in lockstep; never overlaps itself.
const poll=(fn,ms)=>{let busy=false,t,dead=false;const run=async()=>{if(busy||dead)return;busy=true;try{await fn()}catch(e){}busy=false};
  run();const t0=setTimeout(()=>{t=setInterval(run,ms)},Math.random()*ms);return()=>{dead=true;clearTimeout(t0);clearInterval(t)}};
// Secret per device and room; the server only stores its hash. Reusing it lets a player resume after a reload.
const newTok=c=>{const b=crypto.getRandomValues(new Uint8Array(32)),t=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');ls.set('mdc_tok_'+c,t);return t};
const tokFor=c=>ls.get('mdc_tok_'+c)||newTok(c);

let st={},subs=[],tick;
const show=h=>{app.innerHTML=h}, msg=t=>{const m=$('#msg');if(m)m.textContent=t};
const unsub=()=>{subs.forEach(f=>f());subs=[];clearInterval(tick)};

/* ---------- registration (all fields mandatory; the server checks them again) ---------- */
const FIELDS=[
  ['nm',v=>v.length>=2,'Please enter your full name.'],
  ['em',v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v),'Please enter a valid mail ID (e.g. priya@gitam.in).'],
  ['hr',v=>/^[A-Za-z0-9_.-]{2,40}$/.test(v),'Please enter your HackerRank username (letters, digits, _ . -), exactly as on HackerRank.'],
  ['rn',v=>/^[A-Z0-9]{5,20}$/.test(v),'Please enter a valid registration number (5–20 letters/digits).'],
  ['yr',v=>YEARS.includes(v),'Please select your year.'],
  ['dp',v=>DEPTS.includes(v),'Please select your department.'],
  ['rc',v=>/^[A-Z0-9]{5}$/.test(v),'Please enter the 5-character room code.']
];
function home(){
  unsub(); st={};
  const ySel=ls.get('mdc_year'), dSel=ls.get('mdc_dept'), R='<span class="rq">*</span>';
  show(`<main class="card compact">${BRAND}
    <h1>Join the quiz</h1>
    <p class="sub">Enter the room code your host shared and fill in your details. All fields are required.</p>
    <form class="form-grid" id="jf" novalidate>
      <label class="full">Full name${R}<input id="nm" maxlength="40" required autocomplete="name" placeholder="e.g. Priya Sharma" value="${esc(ls.get('mdc_name')||'')}"></label>
      <label class="full">Mail ID${R}<input id="em" type="email" required inputmode="email" autocomplete="email" placeholder="e.g. priya@gitam.in" value="${esc(ls.get('mdc_mail')||'')}"></label>
      <label>HackerRank username${R}<input id="hr" maxlength="40" required autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. priya_sharma" value="${esc(ls.get('mdc_hr')||'')}"></label>
      <label>Registration number${R}<input id="rn" maxlength="20" required placeholder="e.g. 2023001234" value="${esc(ls.get('mdc_reg')||'')}"></label>
      <label>Year${R}<select id="yr" required><option value="" disabled${YEARS.includes(ySel)?'':' selected'}>Select year</option>${YEARS.map(y=>`<option${y===ySel?' selected':''}>${esc(y)}</option>`).join('')}</select></label>
      <label>Department${R}<select id="dp" required><option value="" disabled${DEPTS.includes(dSel)?'':' selected'}>Select department</option>${DEPTS.map(d=>`<option${d===dSel?' selected':''}>${esc(d)}</option>`).join('')}</select></label>
      <label class="full">Room code${R}<input id="rc" maxlength="5" required placeholder="ABCDE" autocapitalize="characters" value="${esc(location.hash.slice(1).slice(0,5))}"></label>
      <button class="btn full" id="jb">Join the room →</button>
    </form>
    <p id="msg" class="msg"></p>
    <a class="lnk" onclick="openHost()">Admin portal →</a>
  </main>`);
  $('#jf').onsubmit=e=>{e.preventDefault();join()};
  FIELDS.forEach(([id])=>{const el=$('#'+id);el.oninput=el.onchange=()=>el.classList.remove('inv')});
}
function readForm(){
  const v={nm:$('#nm').value.trim().replace(/\s+/g,' '),em:$('#em').value.trim().toLowerCase(),hr:$('#hr').value.trim().replace(/^@/,''),rn:$('#rn').value.replace(/\s+/g,'').toUpperCase(),
    yr:$('#yr').value,dp:$('#dp').value,rc:$('#rc').value.trim().toUpperCase()};
  let first='';
  FIELDS.forEach(([id,ok,m])=>{const bad=!ok(v[id]);$('#'+id).classList.toggle('inv',bad);if(bad&&!first){first=m;$('#'+id).focus()}});
  return first?(msg(first),null):v;
}

async function join(){
  const v=readForm(); if(!v) return;
  const c=v.rc, jb=$('#jb'), args=t=>({p_code:c,p_name:v.nm,p_email:v.em,p_reg:v.rn,p_year:v.yr,p_dept:v.dp,p_token:t,p_hr:v.hr});
  jb.disabled=true; msg('');
  try{
    let tok=tokFor(c), res;
    try{res=await rpc('quiz_join',args(tok))}
    catch(e){if(e.message!=='DEVICE_MISMATCH')throw e;tok=newTok(c);res=await rpc('quiz_join',args(tok))}  // shared device, different student
    ls.set('mdc_name',v.nm); ls.set('mdc_mail',v.em); ls.set('mdc_hr',v.hr); ls.set('mdc_reg',v.rn); ls.set('mdc_year',v.yr); ls.set('mdc_dept',v.dp);
    const r=res.room, m=res.me;
    st={c,tok,title:r.title,secs:r.secs,total:r.total,status:r.status,n:m.name,reg:m.reg,year:m.year,dept:m.dept,v:'',seq:0};
    applyMe(m); unsub(); route();
    subs.push(poll(async()=>{const s=await rpc('quiz_state',{p_token:st.tok},1);
      if(s.removed) return removed();
      if(s.status!==st.status){st.status=s.status;route()}},2500));
  }catch(e){
    const m=friendly(e); msg(m);
    if(/HackerRank/i.test(m))$('#hr').classList.add('inv'); else if(/registration number/i.test(m))$('#rn').classList.add('inv'); else if(/room/i.test(m))$('#rc').classList.add('inv');
  }finally{const b=$('#jb');if(b)b.disabled=false}
}
const applyMe=m=>{if(m)Object.assign(st,{i:m.done,score:m.score,ok:m.ok,ms:m.ms})};
function removed(){unsub();st.v='gone';show('<main class="card center">'+BRAND+'<div class="big">👋</div><h1>You were removed</h1><p class="sub">The host took you out of this room.</p><a class="lnk" onclick="home()">Back to start</a></main>')}

function route(){
  if(st.v==='gone') return;
  const w=st.status==='ended'||st.i>=st.total?'end':st.status==='lobby'?'lobby':'q';
  if(w===st.v) return; st.v=w; ({end:results,lobby,q:ask})[w]();
}
function lobby(){
  show(`<main class="card center">${BRAND}<div class="big">☕</div><h1>You're in, ${esc(st.n)}!</h1><p class="sub">${esc(st.title)} · ${st.total} questions · ${st.secs}s each.<br>${esc(st.reg)} · ${esc(st.year)} · ${esc(st.dept)}<br>Sit tight, the host will start things shortly.</p></main>`);
}
// Keeps retrying through network trouble; gives up only on a real error from the server.
async function rpcPersist(fn,args,onWait){for(;;){try{return await rpc(fn,args)}catch(e){if(e.fatal)throw e;onWait&&onWait();await sleep(2000)}}}
async function ask(){
  const my=++st.seq, alive=()=>st.v==='q'&&st.seq===my;
  show(`<main class="card center">${BRAND}<p class="sub">Loading question…</p></main>`);
  let q; try{q=await rpcPersist('quiz_question',{p_token:st.tok})}catch(e){if(alive())show(`<main class="card center">${BRAND}<p class="msg">${esc(friendly(e))}</p><a class="lnk" onclick="st.v='';route()">Try again</a></main>`);return}
  if(!alive()) return;
  if(q.removed) return removed();
  applyMe(q.me);
  if(q.q==null){st.status=q.status||st.status;st.v='';return route()}
  const S=q.secs, end=Date.now()+q.left_ms; let locked=false;
  show(`<main class="card"><div class="top"><span>Question ${q.index+1} / ${st.total}</span><span class="pts">${q.p} pt${q.p>1?'s':''}</span><b id="tm">${Math.max(0,Math.ceil(q.left_ms/1000))}</b></div><div class="bar"><i id="bar"></i></div>
  <h2>${esc(q.q)}</h2><div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><em>${'ABCDEFGH'[k]}</em>${esc(o)}</button>`).join('')}</div><p class="live">${st.score} points so far</p></main>`);
  const fin=async k=>{
    if(locked) return; locked=true; clearInterval(tick);
    document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.k===k)b.classList.add('pick')});
    $('#tm').textContent='…';
    let r; try{r=await rpcPersist('quiz_answer',{p_token:st.tok,p_index:q.index,p_choice:k},()=>{if(alive())$('#tm').textContent='Reconnecting…'})}
    catch(e){if(alive()){st.v='';route()}return}
    if(r.removed) return removed();
    applyMe(r.me);
    if(r.answer==null){st.status=r.status;st.v='';return route()}  // quiz was ended by the host
    if(!alive()) return;
    document.querySelectorAll('.opt').forEach(b=>{const j=+b.dataset.k;if(j===r.answer)b.classList.add('good');else if(j===k)b.classList.add('bad')});
    $('#tm').textContent=r.ok?'+'+r.gain:k<0?"Time's up":'Not quite';
    setTimeout(()=>{if(alive()){st.v='';route()}},900);
  };
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>fin(+b.dataset.k));
  tick=setInterval(()=>{const l=end-Date.now();$('#bar').style.width=Math.max(0,l/S/10)+'%';$('#tm').textContent=Math.max(0,Math.ceil(l/1000));if(l<=0)fin(-1)},100);
}

/* ---------- results (player) with Top Participants button ---------- */
function results(){
  unsub(); const N=st.total;
  st.allRows=st.allRows||[];
  show(`<main class="card wide">${BRAND}
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px">
      <div>
        <h1 style="margin:0">${st.i>=N?'You did it! 🎉':'Quiz finished'}</h1>
        <p class="sub" style="margin:4px 0 0">You scored <b>${st.score}</b> points · ${st.ok}/${N} correct · ${(st.ms/1000).toFixed(1)}s total</p>
      </div>
      <button class="btn" style="width:auto;margin:0;padding:11px 18px" onclick="showTop5()">🏆 Top Participants</button>
    </div>
    <h3>Leaderboard</h3><div id="lb">Loading…</div>
    ${top5ModalHTML()}
  </main>`);
  // the public leaderboard only contains name, score, time and finished flag
  subs.push(poll(async()=>{
    st.allRows=await rpc('quiz_leaderboard',{p_token:st.tok},1);
    const e=$('#lb'); if(e) e.innerHTML=board(st.allRows,false);
  },5000));
}

/* ---------- top 5 modal helpers (with histogram) ---------- */
function top5ModalHTML(){
  return `<div id="top5-modal" class="modal" style="display:none">
    <div class="modal-card">
      <h2>🏆 Top 5 Participants</h2>
      <div id="top5-list"></div>
      <button class="btn" onclick="closeTop5()">Close</button>
    </div>
  </div>`;
}
function showTop5(){
  const rows=(st.allRows||[]).slice().sort((a,b)=>b.score-a.score||a.ms-b.ms).slice(0,5);
  const medals=['🥇','🥈','🥉','4️⃣','5️⃣'];
  const max=Math.max(...rows.map(p=>p.score||0),1);
  const list=$('#top5-list');
  if(list){
    if(!rows.length){
      list.innerHTML='<p class="sub" style="text-align:center;margin:0">No scores yet.</p>';
    } else {
      const bars=rows.map(p=>{
        const h=Math.max(4,Math.round((p.score/max)*100));
        return `<div class="hist-col">
          <div class="hist-bar${p.me?' me':''}" style="height:${h}%">
            <span class="hist-val">${p.score}</span>
          </div>
        </div>`;
      }).join('');
      const names=rows.map((p,i)=>
        `<div class="nm-col${p.me?' me':''}">${medals[i]} ${esc(p.name)}${p.me?' (you)':''}</div>`
      ).join('');
      list.innerHTML=`<div class="hist">
        <div class="hist-bars">${bars}</div>
        <div class="hist-names">${names}</div>
      </div>`;
    }
  }
  const m=$('#top5-modal'); if(m) m.style.display='flex';
}
function closeTop5(){ const m=$('#top5-modal'); if(m) m.style.display='none'; }

function board(rows,adm){
  const N=st.r?st.r.total:st.total||0; rows.sort((a,b)=>b.score-a.score||a.ms-b.ms);
  return `<ol class="lb">${rows.map((p,i)=>`<li class="${p.me?'me':''}"><span class="rk">${['🥇','🥈','🥉'][i]||i+1}</span><span class="nm">${esc(p.name)}${p.me?' (you)':''}</span>${adm?`<small>${esc(p.reg||'—')} · ${esc(p.year||'—')} · ${esc(p.dept||'—')}</small><small>${p.done}/${N} · ${p.ok} ✓</small>`:`<small>${p.fin||st.status==='ended'?'':'playing…'}</small>`}<small>${((p.ms||0)/1000).toFixed(1)}s</small><b>${p.score||0}</b>${adm?`<button class="x" title="Remove" onclick="kick('${esc(p.id)}')">✕</button>`:''}</li>`).join('')||'<p class="sub">Nobody here yet.</p>'}</ol>`;
}
function logins(rows){
  const N=st.r.total, now=Date.now();
  rows=rows.slice().sort((a,b)=>(a.joined||0)-(b.joined||0));
  return `<div class="tw"><table><thead><tr><th>#</th><th>Name</th><th>Mail ID</th><th>HackerRank</th><th>Reg. No.</th><th>Year</th><th>Department</th><th>Logged in</th><th>Last active</th><th>Logins</th><th>Progress</th><th>Status</th><th></th></tr></thead><tbody>${rows.map((p,i)=>{
    const on=p.last&&now-p.last<45000, s=p.fin?'Finished':p.done?'Playing':'In lobby';
    return `<tr><td>${i+1}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.email||'—')}</td><td>${esc(p.hr||'—')}</td><td>${esc(p.reg||'—')}</td><td>${esc(p.year||'—')}</td><td>${esc(p.dept||'—')}</td><td>${tm(p.joined)}</td><td>${tm(p.last)}</td><td>${p.logins||1}</td><td>${p.done}/${N}</td><td><span class="dot ${p.fin?'':on?'on':'dn'}"></span>${s}${on&&!p.fin?' · online':''}</td><td><button class="x" title="Remove" onclick="kick('${esc(p.id)}')">✕</button></td></tr>`}).join('')||'<tr><td colspan="13" class="sub">Nobody has logged in yet.</td></tr>'}</tbody></table></div>`;
}

/* ---------- admin portal (password checked by the server; session kept for this tab only) ---------- */
const sess=()=>ss.get('mdc_admin');
async function adm(fn,args={}){
  try{return await rpc(fn,{p_session:sess(),...args})}
  catch(e){if(/^ADMIN_SESSION/.test(e.message)){ss.set('mdc_admin',null);openHost('Your admin session expired. Please log in again.')}throw e}
}
function openHost(note){
  unsub();
  if(sess()) return hostForm();
  show(`<main class="card">${BRAND}<h1>Admin portal 🔑</h1><p class="sub">Enter the host password to continue.</p><label>Password<input id="pw" type="password" autocomplete="current-password"></label><button class="btn" id="ub" onclick="unlock()">Unlock</button><p id="msg" class="msg">${esc(note||'')}</p><a class="lnk" onclick="home()">← Back</a></main>`);
  $('#pw').onkeydown=e=>{if(e.key==='Enter')unlock()}; $('#pw').focus();
}
async function unlock(){
  const b=$('#ub'); b.disabled=true;
  try{const r=await rpc('quiz_admin_login',{p_password:$('#pw').value});
    if(r.error) return msg(r.error);
    ss.set('mdc_admin',r.session); hostForm();
  }catch(e){msg(friendly(e))}finally{if($('#ub'))$('#ub').disabled=false}
}
async function logout(){try{await rpc('quiz_admin_logout',{p_session:sess()})}catch(e){} ss.set('mdc_admin',null); home()}
function hostForm(){
  unsub(); const last=ls.get('mdc_room');
  show(`<main class="card wide">${BRAND}<h1>Host a quiz</h1><p class="sub">Leave the box empty to use the built-in Time Complexity quiz. To use your own, load a JSON file in the same format (title, questions[question, options{A..D}, correct_answer, points]).</p>
  <input type="file" id="f" accept=".json"><label>…or paste JSON<textarea id="js" rows="4"></textarea></label>
  <label>Seconds per question<input id="secs" type="number" value="25" min="5" max="120"></label>
  <button class="btn" id="cb" onclick="create()">Create room</button>${last?`<button class="btn alt" onclick="dash('${esc(last)}')">Resume room ${esc(last)}</button>`:''}
  <p id="msg" class="msg"></p><a class="lnk" onclick="home()">← Back</a> · <a class="lnk" onclick="logout()">Log out</a></main>`);
  $('#f').onchange=e=>e.target.files[0]&&e.target.files[0].text().then(t=>$('#js').value=t);
}
async function create(){
  const b=$('#cb');
  try{
    const t=$('#js').value.trim(); let title=null, qs=null;
    if(t){
      const j=JSON.parse(t); title=j.title||'Quiz';
      qs=j.questions.map(q=>({q:q.question,o:Object.values(q.options),a:Object.keys(q.options).indexOf(q.correct_answer),p:q.points||1}));
      if(!qs.length||qs.some(q=>q.a<0||q.o.length<2)) throw Error('Each question needs 2+ options and a valid correct_answer');
    }
    b.disabled=true;
    const c=await adm('quiz_admin_create_room',{p_secs:+$('#secs').value||25,p_title:title,p_questions:qs});
    ls.set('mdc_room',c); dash(c);
  }catch(e){if(!/^ADMIN_SESSION/.test(e.message))msg('Could not create: '+friendly(e))}
  finally{if($('#cb'))$('#cb').disabled=false}
}
function dash(c){
  unsub(); st={v:'dash',c,rows:[],allRows:[],tab:'lb'};
  show(`<main class="card wide">${BRAND}<div class="hd"><div><small class="sub">Room code, share it with players</small><div class="code">${esc(c)}</div></div><div class="acts"><a class="btn alt" href="quiz.html?board=${encodeURIComponent(c)}" target="_blank" rel="noopener">📺 Projector leaderboard</a><a class="btn alt" href="hackoween.html" target="_blank" rel="noopener">🎃 Hack-O-Ween scoreboard</a><button class="btn ok" id="xl" onclick="exportXlsx()">⬇ Export to Excel</button><span id="hb"></span></div></div>
  <div class="stats" id="stats"></div>
  <div class="tabs"><button class="tab on" id="t-lb" onclick="tab('lb')">🏆 Leaderboard</button><button class="tab" id="t-lg" onclick="tab('lg')">🔐 Registrations</button></div>
  <p id="msg" class="msg"></p><div id="lb"></div><a class="lnk" onclick="hostForm()">← Leave room</a> · <a class="lnk" onclick="logout()">Log out</a>${top5ModalHTML()}</main>`);
  subs.push(poll(refresh,3000));
}
async function refresh(){
  const c=st.c, d=await adm('quiz_admin_dashboard',{p_code:c});
  if(st.v!=='dash'||st.c!==c) return;
  const S=d.room.status, changed=!st.r||st.r.status!==S;
  st.r=d.room; st.rows=st.allRows=d.players;
  if(changed) $('#hb').innerHTML=S==='lobby'
    ? '<button class="btn" onclick="setS(\'live\')">Start quiz ▶</button>'
    : S==='live'
      ? '<button class="btn alt" onclick="setS(\'ended\')">End quiz ■</button>'
      : '<button class="btn" onclick="showTop5()">🏆 Top Participants</button> <button class="btn alt" onclick="hostForm()">New quiz</button>';
  paint();
}
function tab(t){st.tab=t;$('#t-lb').classList.toggle('on',t==='lb');$('#t-lg').classList.toggle('on',t==='lg');paint()}
function paint(){
  if(!$('#lb')||!st.r) return;
  const n=st.rows.length, f=st.rows.filter(p=>p.fin).length, on=st.rows.filter(p=>p.last&&Date.now()-p.last<45000&&!p.fin).length;
  $('#stats').innerHTML=`<div><b>${n}</b>Registered</div><div><b>${f}</b>Finished</div><div><b>${esc(st.r.status)}</b>Status · ${on} online</div>`;
  $('#lb').innerHTML=st.tab==='lg'?logins(st.rows):board(st.rows.slice(),true);
}
const act=async(fn,args)=>{try{await adm(fn,{p_code:st.c,...args});await refresh()}catch(e){if(!/^ADMIN_SESSION/.test(e.message))msg(friendly(e))}};
const setS=s=>act('quiz_admin_set_status',{p_status:s});
const kick=id=>act('quiz_admin_kick',{p_id:id});

/* ---------- Excel export (admin) ---------- */
const loadXLSX=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(Error('could not load the Excel library'));document.head.appendChild(s)});
const dt=t=>t?new Date(t).toLocaleString():'';
async function exportXlsx(){
  const b=$('#xl'), c=st.c;
  b.disabled=true; b.textContent='Preparing…'; msg('');
  try{
    const [,d]=await Promise.all([loadXLSX(),adm('quiz_admin_dashboard',{p_code:c,p_questions:true})]);
    const qs=d.room.qs, N=qs.length, L=k=>k>=0?'ABCDEFGH'[k]:'No answer';
    const rows=d.players.slice().sort((a,b)=>b.score-a.score||a.ms-b.ms);
    const participants=rows.map((p,i)=>({
      'Rank':i+1,'Full Name':p.name,'Mail ID':p.email,'HackerRank Username':p.hr||'','Registration No.':p.reg,'Year':p.year,'Department':p.dept,
      'Score':p.score,'Correct':p.ok,'Total Questions':N,'Answered':p.done,'Time Taken (s)':+(p.ms/1000).toFixed(1),
      'Status':p.fin?'Finished':p.done?'Incomplete':'Did not start','Joined At':dt(p.joined),'Last Active':dt(p.last),'Logins':p.logins}));
    const answers=rows.map(p=>{const o={'Full Name':p.name,'Registration No.':p.reg};
      qs.forEach((q,j)=>{const a=p.ans[j];o['Q'+(j+1)]=a==null?'':L(a)+(a===q.a?' ✓':' ✗')});return o});
    const questions=qs.map((q,j)=>{const o={'#':j+1,'Question':q.q,'Points':q.p,'Correct Answer':L(q.a)};
      q.o.forEach((t,k)=>o['Option '+L(k)]=t);
      o['Answered Correctly']=rows.filter(p=>p.ans[j]===q.a).length;return o});
    const wb=XLSX.utils.book_new(), add=(data,name,w)=>{const ws=XLSX.utils.json_to_sheet(data.length?data:[{'':'No data'}]);ws['!cols']=w;XLSX.utils.book_append_sheet(wb,ws,name)};
    add(participants,'Participants',[6,24,30,20,18,10,14,8,8,14,10,14,14,22,22,8].map(wch=>({wch})));
    add(answers,'Answers',[{wch:24},{wch:18}]);
    add(questions,'Questions',[{wch:4},{wch:60},{wch:7},{wch:14}]);
    XLSX.writeFile(wb,`MDC_Quiz_${c}_${new Date().toLocaleDateString('en-CA')}.xlsx`);
  }catch(e){if(!/^ADMIN_SESSION/.test(e.message))msg('Export failed: '+friendly(e))}
  finally{if($('#xl')){b.disabled=false;b.textContent='⬇ Export to Excel'}}
}

/* ---------- projector leaderboard: quiz.html?board=CODE (read-only, no login) ----------
   Polls the room every 2 seconds while people answer; rows slide to their new place. */
function quizBoard(code){
  unsub(); code=String(code).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
  document.title='Leaderboard '+code+' · MDC Quiz';
  show(`<main class="card wide proj">${BRAND}<div class="hd"><div><small class="sub">Live leaderboard · room</small><div class="code">${esc(code)}</div></div><div class="meta" id="qbMeta">Loading…</div></div><ol class="lb" id="qb"></ol></main>`);
  const nodes=new Map(), reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  subs.push(poll(async()=>{
    const d=await rpc('quiz_room_board',{p_code:code},1), list=$('#qb'); if(!list) return;
    if(d.missing){ $('#qbMeta').textContent='There is no room with this code.'; return; }
    const N=d.room.total, S=d.room.status, fin=d.players.filter(p=>p.fin).length;
    $('#qbMeta').innerHTML=`${esc(d.room.title)}<br>${S==='live'?'Live':S==='ended'?'Final results':'Waiting to start'} · ${d.players.length} player${d.players.length===1?'':'s'}${S==='live'?' · '+fin+' finished':''}`;
    const before=new Map(); nodes.forEach((n,id)=>before.set(id,n.getBoundingClientRect().top));
    const keep=new Set();
    d.players.forEach((p,i)=>{
      keep.add(p.id); let n=nodes.get(p.id); if(!n){ n=document.createElement('li'); nodes.set(p.id,n); }
      const grew=n.dataset.score!=null&&+n.dataset.score<p.score; n.dataset.score=p.score;
      n.className=(i<3?'top':'')+(grew?' bump':'');
      n.innerHTML=`<span class="rk">${['🥇','🥈','🥉'][i]||i+1}</span><span class="nm">${esc(p.name)}</span><small>${p.fin||S==='ended'?'':p.done+'/'+N}</small><small>${((p.ms||0)/1000).toFixed(1)}s</small><b>${p.score}</b>`;
      if(list.children[i]!==n) list.insertBefore(n,list.children[i]||null);
    });
    nodes.forEach((n,id)=>{ if(!keep.has(id)){ n.remove(); nodes.delete(id); } });
    if(!d.players.length) list.innerHTML='<p class="sub">Nobody has joined yet.</p>';
    if(!reduce) nodes.forEach((n,id)=>{
      const t=before.get(id); if(t==null) return; const dy=t-n.getBoundingClientRect().top; if(Math.abs(dy)<1) return;
      n.style.transition='none'; n.style.transform=`translateY(${dy}px)`; n.getBoundingClientRect();
      n.style.transition='transform .7s cubic-bezier(.2,.8,.2,1)'; n.style.transform='';
    });
  },2000));
}

const boardCode=new URLSearchParams(location.search).get('board');
if(boardCode) quizBoard(boardCode); else home();
</script></body></html>
